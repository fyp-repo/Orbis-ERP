<div class="centered splash orbis-loader-overlay">
    <style>
        .centered.splash,
        .orbis-loader-overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 999999 !important;
            background: radial-gradient(ellipse at center, #07101E 0%, #03060B 65%, #010204 100%) !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
            transform: none !important;
            -webkit-transform: none !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
        }

        .orbis-loader-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .orbis-ring-ambient {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 195, 255, 0.28) 0%, rgba(0, 120, 255, 0.08) 50%, transparent 72%);
            filter: blur(18px);
            animation: orbis-ambient-pulse 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .orbis-ring-track {
            position: absolute;
            width: 236px;
            height: 236px;
            border-radius: 50%;
            border: 2px solid rgba(0, 195, 255, 0.15);
            background: rgba(4, 8, 16, 0.7);
            box-shadow: 
                0 0 30px rgba(0, 195, 255, 0.15),
                inset 0 0 20px rgba(0, 0, 0, 0.9);
        }

        .orbis-ring-spinner {
            position: absolute;
            width: 236px;
            height: 236px;
            border-radius: 50%;
            border: 3.5px solid transparent;
            border-top: 3.5px solid #00D2FF;
            border-right: 3.5px solid rgba(0, 210, 255, 0.55);
            border-bottom: 3.5px solid transparent;
            border-left: 3.5px solid rgba(0, 140, 255, 0.25);
            box-shadow: 
                0 0 20px rgba(0, 210, 255, 0.8),
                0 0 40px rgba(0, 150, 255, 0.4),
                inset 0 0 15px rgba(0, 210, 255, 0.35);
            animation: orbis-ring-rotate 2.4s linear infinite;
            will-change: transform;
        }

        .orbis-ring-reverse {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top: 1.5px solid rgba(0, 225, 255, 0.7);
            border-bottom: 1.5px solid rgba(0, 160, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 195, 255, 0.2);
            animation: orbis-ring-rotate-reverse 5s linear infinite;
            will-change: transform;
        }

        .orbis-circle-logo-core {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at center, #0A1324 0%, #03060C 75%, #010204 100%);
            border: 2px solid rgba(0, 195, 255, 0.35);
            box-shadow: 
                inset 0 0 22px rgba(0, 0, 0, 0.95),
                inset 0 0 16px rgba(0, 195, 255, 0.25),
                0 0 35px rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 2;
        }

        .orbis-circle-logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 16px rgba(0, 195, 255, 0.55));
            animation: orbis-core-breathe 3.5s ease-in-out infinite alternate;
        }

        .orbis-loader-brand {
            margin-top: 32px;
            text-align: center;
            z-index: 2;
        }

        .orbis-loader-brand-title {
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #F8FAFC;
            text-transform: uppercase;
            text-shadow: 0 0 16px rgba(0, 195, 255, 0.6);
            margin-bottom: 8px;
        }

        .orbis-loader-brand-status {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2.5px;
            color: #00C3FF;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0.95;
            text-shadow: 0 0 8px rgba(0, 195, 255, 0.4);
        }

        .orbis-status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00E5FF;
            box-shadow: 0 0 8px #00E5FF, 0 0 16px rgba(0, 229, 255, 0.8);
            animation: orbis-indicator-pulse 1.4s ease-in-out infinite alternate;
        }

        @keyframes orbis-ring-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes orbis-ring-rotate-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes orbis-ambient-pulse {
            0% { transform: scale(0.95); opacity: 0.6; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        @keyframes orbis-core-breathe {
            0% { filter: drop-shadow(0 0 14px rgba(0, 195, 255, 0.45)); transform: scale(0.99); }
            100% { filter: drop-shadow(0 0 24px rgba(0, 195, 255, 0.8)); transform: scale(1.01); }
        }

        @keyframes orbis-indicator-pulse {
            0% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
    <div class="orbis-loader-container">
        <div class="orbis-ring-ambient"></div>
        <div class="orbis-ring-track"></div>
        <div class="orbis-ring-spinner"></div>
        <div class="orbis-ring-reverse"></div>
        <div class="orbis-circle-logo-core">
            <img src="{{ splash_image or '/files/ocm_logo_circular.png' }}" alt="Orbis Car Manufacturing" class="orbis-circle-logo-img">
        </div>
    </div>
    <div class="orbis-loader-brand">
        <div class="orbis-loader-brand-title">ORBIS CAR MANUFACTURING</div>
        <div class="orbis-loader-brand-status">
            <span class="orbis-status-indicator"></span>
            ORBIS ERP &middot; SYSTEM INITIALIZING
        </div>
    </div>
</div>
